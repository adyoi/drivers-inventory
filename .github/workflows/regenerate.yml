name: Regenerate docs

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PowerShell
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
      - name: Generate inventory
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/gen_docs.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/gen_readme.ps1
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/index.html README.md tools/drivers_inventory.csv
          if (git diff --cached --quiet); then echo "No changes"; else git commit -m "Auto-regenerate inventory [skip ci]"; git push; fi
        shell: bash
